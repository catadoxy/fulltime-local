# Pull-based compose: uses the image published to GitHub Container Registry.
#   docker compose up -d
#
# If the package is private you must log in first (see README).
services:
  app:
    image: ghcr.io/catadoxy/fulltime-local:latest
    container_name: fulltime-local
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - TZ=Europe/Bucharest
    restart: unless-stopped
